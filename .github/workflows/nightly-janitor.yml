# repo-janitor cleaning itself. The copy-ready version for other repositories is
# examples/.github/workflows/nightly-janitor.yml.
name: Nightly janitor

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./
